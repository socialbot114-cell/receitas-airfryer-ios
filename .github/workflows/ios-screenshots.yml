name: Airfryer iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    strategy:
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
          - name: iPad Air 13-inch (M4)
            slug: ipad
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate
      - name: Run tests and capture screenshots
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ReceitasAirfryer.xcodeproj \
            -scheme ReceitasAirfryer \
            -destination 'platform=iOS Simulator,name=${{ matrix.device.name }},OS=26.5' \
            -resultBundlePath "$RUNNER_TEMP/airfryer-${{ matrix.device.slug }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/airfryer-screenshots"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/airfryer-${{ matrix.device.slug }}.xcresult" \
            --output-path "$RUNNER_TEMP/airfryer-screenshots-${{ matrix.device.slug }}"
      - uses: actions/upload-artifact@v4
        with:
          name: airfryer-ios-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/airfryer-screenshots-${{ matrix.device.slug }}
