name: Receitas iOS App Store Submission

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect App Store Connect or submit the version for App Review
        required: true
        type: choice
        options:
          - inspect
          - submit
        default: inspect
      app_version:
        description: App Store version to release
        required: true
        type: string
        default: "1.2.0"
      build_number:
        description: Uploaded App Store build number
        required: true
        type: string
        default: "8"

permissions:
  contents: read

concurrency:
  group: receitas-app-store-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install App Store Connect JWT dependency
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]'

      - name: Inspect or submit App Store version
        run: python iosApp/Scripts/submit_app_store_review.py
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          SUBMISSION_MODE: ${{ inputs.mode }}
          APP_STORE_VERSION: ${{ inputs.app_version }}
          APP_STORE_BUILD_NUMBER: ${{ inputs.build_number }}
