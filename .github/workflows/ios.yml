name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_xcode_cloud:
        description: Trigger the connected Xcode Cloud workflow after simulator tests
        required: true
        type: boolean
        default: false
      xcode_cloud_workflow_name:
        description: Exact workflow name if the app has multiple enabled Xcode Cloud workflows
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and release metadata
        run: python3 iosApp/Scripts/validate_ios.py

  build:
    runs-on: macos-26
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate
      - name: Test
        working-directory: iosApp
        run: |
          xcodebuild test \
            -project ReceitasAirfryer.xcodeproj \
            -scheme ReceitasAirfryer \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            CODE_SIGNING_ALLOWED=NO

      - name: Set up Python for Xcode Cloud API
        if: ${{ inputs.run_xcode_cloud }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install App Store Connect JWT dependency
        if: ${{ inputs.run_xcode_cloud }}
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]'

      - name: Trigger and verify Xcode Cloud build
        if: ${{ inputs.run_xcode_cloud }}
        run: python iosApp/Scripts/trigger_xcode_cloud_build.py
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          XCODE_CLOUD_WORKFLOW_NAME: ${{ inputs.xcode_cloud_workflow_name }}
          XCODE_CLOUD_RUN_TIMEOUT_MINUTES: "90"
          APP_STORE_PROCESSING_TIMEOUT_MINUTES: "45"
