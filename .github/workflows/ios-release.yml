name: Receitas iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_DISTRIBUTION_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          APPLE_DISTRIBUTION_KEY: ${{ secrets.APPLE_DISTRIBUTION_KEY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_DISTRIBUTION_CERT APPLE_DISTRIBUTION_KEY APPLE_PROVISIONING_PROFILE; do
            test -n "${!name:-}" || { echo "Missing secret: $name" >&2; exit 1; }
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate

      - name: Install signing assets
        env:
          APPLE_DISTRIBUTION_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          APPLE_DISTRIBUTION_KEY: ${{ secrets.APPLE_DISTRIBUTION_KEY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_DISTRIBUTION_CERT" | base64 --decode > "$RUNNER_TEMP/distribution.cer"
          printf '%s' "$APPLE_DISTRIBUTION_KEY" | base64 --decode > "$RUNNER_TEMP/distribution.key"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$app_identifier" = "$team_id.br.com.receitasairfyer"
          printf 'PROFILE_NAME=%s\nTEAM_ID=%s\n' "$profile_name" "$team_id" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.key" -k "$keychain" -P '' -A -T /usr/bin/codesign
          security import "$RUNNER_TEMP/distribution.cer" -k "$keychain" -P '' -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

      - name: Archive
        working-directory: iosApp
        run: |
          xcodebuild archive \
            -project ReceitasAirfryer.xcodeproj \
            -scheme ReceitasAirfryer \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ReceitasAirfryer.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION=1.0

      - name: Export IPA
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist').open('wb') as file:
              plistlib.dump({'method': 'app-store', 'signingStyle': 'manual', 'teamID': os.environ['TEAM_ID'], 'provisioningProfiles': {'br.com.receitasairfyer': os.environ['PROFILE_NAME']}}, file)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ReceitasAirfryer.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Validate IPA
        run: |
          set -euo pipefail
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          test -f "${ipa[0]}"
          unzip -q "${ipa[0]}" -d "$RUNNER_TEMP/ipa"
          app=("$RUNNER_TEMP"/ipa/Payload/*.app)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app[0]}/Info.plist" | grep -qx 'br.com.receitasairfyer'
          test -f "${app[0]}/PrivacyInfo.xcprivacy"
          test -f "${app[0]}/Assets.car"
          codesign --verify --deep --strict "${app[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: receitas-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload TestFlight
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          xcrun altool --upload-app --type ios --file "${ipa[0]}" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
