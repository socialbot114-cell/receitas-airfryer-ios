name: ReceitasAirfryer
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: br.com.receitasairfyer
    PRODUCT_NAME: "Receitas Airfryer"
    APP_STORE_ID: "6813681707"
    DEVELOPMENT_TEAM: ""
targets:
  ReceitasAirfryer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Images
        type: folder
        buildPhase: resources
      - path: Resources/Recipes
        type: folder
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.receitasairfyer
        PRODUCT_MODULE_NAME: ReceitasAirfryer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - ReceitasAirfryerTests
  ReceitasAirfryerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Resources/Recipes
        type: folder
        buildPhase: resources
      - path: Resources/Images
        type: folder
        buildPhase: resources
    dependencies:
      - target: ReceitasAirfryer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.receitasairfyer.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Receitas\ Airfryer.app/Receitas\ Airfryer
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
